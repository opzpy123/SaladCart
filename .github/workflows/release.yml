name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: ""
            artifact: macos-arm64
            target_triple: aarch64-apple-darwin
          - platform: macos-13
            args: "--target x86_64-apple-darwin"
            artifact: macos-x64
            target_triple: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            artifact: windows-x64
            target_triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      SALADCART_TARGET_TRIPLE: ${{ matrix.target_triple }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-13'
        run: rustup target add x86_64-apple-darwin
      - name: Install FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install ffmpeg -y
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled FFmpeg
        run: pnpm prepare:ffmpeg
      - name: Verify bundled FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          ./src-tauri/binaries/ffmpeg-$SALADCART_TARGET_TRIPLE -hide_banner -filters | grep -q " subtitles "
          ./src-tauri/binaries/ffmpeg-$SALADCART_TARGET_TRIPLE -hide_banner -encoders | grep -q "libx264"
      - name: Verify bundled FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ff = "src-tauri/binaries/ffmpeg-$env:SALADCART_TARGET_TRIPLE.exe"
          if (-not (& $ff -hide_banner -filters | Select-String -Quiet "subtitles")) { throw "bundled FFmpeg lacks subtitles" }
          if (-not (& $ff -hide_banner -encoders | Select-String -Quiet "libx264")) { throw "bundled FFmpeg lacks libx264" }
      - name: Run tests
        run: |
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add Apple signing/notarization and Windows signing secrets here before
          # publishing production installers. The current build is unsigned.
        with:
          args: ${{ matrix.args }}
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saladcart-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn
