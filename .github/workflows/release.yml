name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: ""
            artifact: macos-arm64
            target_triple: aarch64-apple-darwin
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            artifact: macos-x64
            target_triple: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            artifact: windows-x64
            target_triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      SALADCART_TARGET_TRIPLE: ${{ matrix.target_triple }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-15-intel'
        run: rustup target add x86_64-apple-darwin
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled FFmpeg
        run: pnpm prepare:ffmpeg
      - name: Verify bundled FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          FF="./src-tauri/binaries/ffmpeg-$SALADCART_TARGET_TRIPLE"
          $FF -version | head -1
          $FF -hide_banner -filters | grep -q " subtitles "
          $FF -hide_banner -filters | grep -q " amix "
          $FF -hide_banner -filters | grep -q " adelay "
          $FF -hide_banner -encoders | grep -q "libx264"
      - name: Verify bundled FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ff = "src-tauri/binaries/ffmpeg-$env:SALADCART_TARGET_TRIPLE.exe"
          & $ff -version | Select-Object -First 1
          if (-not (& $ff -hide_banner -filters | Select-String -Quiet "subtitles")) { throw "bundled FFmpeg lacks subtitles" }
          if (-not (& $ff -hide_banner -filters | Select-String -Quiet "amix")) { throw "bundled FFmpeg lacks amix" }
          if (-not (& $ff -hide_banner -filters | Select-String -Quiet "adelay")) { throw "bundled FFmpeg lacks adelay" }
          if (-not (& $ff -hide_banner -encoders | Select-String -Quiet "libx264")) { throw "bundled FFmpeg lacks libx264" }
      - name: Run frontend tests
        run: pnpm test
      - name: Run Rust tests with bundled FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          SALADCART_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-${{ matrix.target_triple }}
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Run Rust tests with bundled FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SALADCART_FFMPEG: ${{ github.workspace }}\src-tauri\binaries\ffmpeg-${{ matrix.target_triple }}.exe
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Run Windows TTS smoke test
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SALADCART_FFMPEG: ${{ github.workspace }}\src-tauri\binaries\ffmpeg-${{ matrix.target_triple }}.exe
        run: cargo test --manifest-path src-tauri/Cargo.toml system_tts_generates_a_voice_asset -- --ignored --nocapture
      - name: Build installers (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -o pipefail
          pnpm tauri build ${{ matrix.args }} 2>&1 | tee build.log
      - name: Build installers (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          pnpm tauri build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows packaged selftest
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          & src-tauri/target/release/saladcart.exe --selftest
          $code = $LASTEXITCODE
          if (Test-Path saladcart-selftest.log) { Get-Content saladcart-selftest.log }
          if ($code -ne 0) { exit $code }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.artifact }}
          path: build.log
          if-no-files-found: ignore
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saladcart-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
